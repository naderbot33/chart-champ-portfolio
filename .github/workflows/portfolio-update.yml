name: Build ChartChamp preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/*.test.mjs
      - run: node scripts/build-site.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: chartchamp-public-preview
          path: dist/
          retention-days: 14

# Publication and Discord delivery remain deliberate actions. This workflow
# cannot refresh financial data, deploy, post, or restore retired schedules.
